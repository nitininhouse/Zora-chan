name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Generate documentation bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p docs-out
          {
            echo "# Changelog for ${TAG}"
            echo
            git log --pretty=format:'- %s (%h)' "${TAG}"
          } > docs-out/CHANGELOG.md
          cp README.md docs-out/README.md
          tar -czf "docs-${TAG}.tar.gz" -C docs-out .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" "docs-${TAG}.tar.gz" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets not configured; skipping deploy."
            exit 0
          fi
          npx --yes vercel@41 deploy --prod --yes --token "$VERCEL_TOKEN"
