# Copy to .github/workflows/deploy.yml for automated build artifacts on push.
name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ZORA_API_KEY: ci-placeholder
      PINATA_JWT: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 14
