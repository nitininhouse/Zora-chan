# Copy to .github/workflows/ci.yml to enable CI on GitHub Actions.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ZORA_API_KEY: ci-placeholder
      PINATA_JWT: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Generate docs
        run: npm run docs:generate

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer-docs
          path: docs/DEVELOPER.md
